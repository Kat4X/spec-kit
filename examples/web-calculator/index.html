<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="calculator" aria-labelledby="title">
      <h1 id="title">Калькулятор</h1>
      <form id="calculator-form">
        <label for="expression">Выражение</label>
        <input id="expression" name="expression" inputmode="decimal" autocomplete="off" autofocus>
        <output id="message" for="expression" aria-live="polite">Введите выражение</output>
        <div class="keys" aria-label="Клавиатура калькулятора">
          <button type="button" data-value="(">(</button><button type="button" data-value=")">)</button><button type="button" data-action="clear">C</button><button type="button" data-value="÷">÷</button>
          <button type="button" data-value="7">7</button><button type="button" data-value="8">8</button><button type="button" data-value="9">9</button><button type="button" data-value="×">×</button>
          <button type="button" data-value="4">4</button><button type="button" data-value="5">5</button><button type="button" data-value="6">6</button><button type="button" data-value="-">−</button>
          <button type="button" data-value="1">1</button><button type="button" data-value="2">2</button><button type="button" data-value="3">3</button><button type="button" data-value="+">+</button>
          <button type="button" data-value="0" class="wide">0</button><button type="button" data-value=".">.</button><button type="submit" aria-label="Вычислить">=</button>
        </div>
      </form>
    </section>

    <section class="history" aria-labelledby="history-title">
      <header><h2 id="history-title">История</h2><button id="clear-history" type="button">Очистить</button></header>
      <p id="empty-history">Вычислений пока нет</p>
      <ol id="history-list"></ol>
    </section>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
