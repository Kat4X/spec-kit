[package]
name = "workflow-kit-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent-oriented CLI for Workflow Kit artifacts and task queues"
license = "MIT"
publish = false

[[bin]]
name = "workflow-kit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
